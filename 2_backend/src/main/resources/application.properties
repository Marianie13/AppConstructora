spring.application.name=constructora

# Credenciales locales. El archivo local.properties no se sube al
# repositorio (esta en .gitignore); lo crea el script de instalacion.
# "optional:" hace que la aplicacion arranque igual si no existe.
spring.config.import=optional:file:./local.properties

# --- Conexion a MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/constructora_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:constructora_app}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
# validate: Hibernate verifica que las tablas del script SQL coincidan
# con las entidades, pero no modifica el esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Servidor ---
server.port=8080
