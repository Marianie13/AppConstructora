spring.application.name=constructora

# --- Conexion a MySQL ---
# Usuario dedicado creado por el script instalar_base_de_datos.sh
spring.datasource.url=jdbc:mysql://localhost:3306/constructora_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=constructora_app
spring.datasource.password=Constructora2026

# --- JPA / Hibernate ---
# validate: Hibernate verifica que las tablas del script SQL coincidan
# con las entidades, pero no modifica el esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Servidor ---
server.port=8080
